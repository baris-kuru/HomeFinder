# Your personal config. This file is gitignored (holds your data + email password).
# Edit the values below, then run:  .venv/bin/python -m homefinder.main --seed

[poll]
interval_seconds = 300          # how often to check for new listings (5 min)
headless_scrape = true          # scrape in the background; applying always opens a visible window

[filters]
min_rooms = 2                   # inclusive
max_rooms = 4                   # inclusive
min_area = 47.0                 # m², inclusive
max_area = 200.0                # m², inclusive (set high to ignore)
max_rent = 1050.0               # € ceiling, compared against gross rent (Warmmiete)
rent_basis = "gross"            # "gross" (Warmmiete) or "net" (Kaltmiete)
require_no_wbs = true           # true = skip listings that require a WBS
exclude_senior = true           # true = skip senior / age-restricted housing (e.g. "ab 60 Jahren")
districts = []                  # e.g. ["Spandau", "Mitte"]; empty = all districts
# Only these companies get an auto-filled form. All 7 are still scraped + emailed.
apply_companies = ["gewobag", "degewo", "howoge", "stadtundland"]

[applicant]
